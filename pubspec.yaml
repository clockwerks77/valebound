name: habit_adventure
description: "Valebound (working title): a habit adventure. Personal build, fully offline."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Local SQLite storage (DESIGN §9.2). No package here makes network calls
  # at runtime.
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  # Fonts are bundled so nothing is fetched at runtime. Both are SIL Open
  # Font License 1.1; licence texts sit beside the files.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
