name: build

# On every push: code generation, analysis and the full test suite, with logs
# and rendered screenshots published to the `ci-results` branch.
#
# The APKs are built (and the `latest` release replaced) only when the commit
# message contains [apk], or when the workflow is run by hand from the
# Actions tab. That keeps the download link steady between releases and
# saves the account's included Actions minutes. A message containing
# [apk-check] builds the APKs to prove they compile but leaves the release
# alone.
#
# Nothing here ships inside the app. The app itself makes no network calls.

on:
  push:
    branches-ignore:
      - ci-results
      - ci-device-results
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Prepare
        run: |
          mkdir -p ci_out
          flutter --version 2>&1 | tee ci_out/flutter_version.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev >/dev/null

      # One-time: generate the Android scaffold with the pinned Flutter
      # version and commit it back, so it is never hand-written.
      - name: Bootstrap Android scaffold
        id: bootstrap
        run: |
          set -eo pipefail
          if [ ! -d android/app ]; then
            flutter create --platforms=android --org app --project-name habit_adventure --no-pub . 2>&1 | tee ci_out/bootstrap.txt
            rm -f test/widget_test.dart
            sed -i 's/android:label="habit_adventure"/android:label="Valebound"/' android/app/src/main/AndroidManifest.xml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android .metadata
            git commit -m "Add generated Android scaffold (flutter create)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Android scaffold already present." | tee ci_out/bootstrap.txt
          fi

      - name: Dependencies
        id: pub_get
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci_out/pub_get.txt

      - name: Code generation (Drift)
        id: codegen
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci_out/codegen.txt

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci_out/analyze.txt

      - name: Test (also renders screenshots)
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --update-goldens --reporter expanded 2>&1 | tee ci_out/test.txt

      - name: Publish test results
        if: always()
        env:
          S_PUB: ${{ steps.pub_get.outcome }}
          S_CODEGEN: ${{ steps.codegen.outcome }}
          S_ANALYZE: ${{ steps.analyze.outcome }}
          S_TEST: ${{ steps.test.outcome }}
          S_APK: pending
        run: bash tool/ci_publish.sh tests

      # The release build is the one to install: compiled ahead of time, for
      # the phone's arm64 processor only, and with no INTERNET permission.
      # The debug build is kept beside it as a fallback; both are signed with
      # the same fixed personal key, so either installs over the other and
      # the data on the device is kept.
      - name: Build APKs (release, and debug beside it)
        id: apk
        if: contains(github.event.head_commit.message, '[apk') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -eo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          flutter build apk --release --target-platform android-arm64 2>&1 | tee ci_out/build_apk.txt
          cp "$OUT/app-release.apk" "dist/Valebound-${VERSION}.apk"
          flutter build apk --debug 2>&1 | tee ci_out/build_apk_debug.txt
          cp "$OUT/app-debug.apk" "dist/Valebound-${VERSION}-debug.apk"
          ls -la dist 2>&1 | tee -a ci_out/build_apk.txt
          # Which key signed each: must be the fixed personal key.
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          : > ci_out/apk_signer.txt
          : > ci_out/apk_permissions.txt
          for f in dist/*.apk; do
            echo "$(basename "$f")" | tee -a ci_out/apk_signer.txt ci_out/apk_permissions.txt
            "$BT/apksigner" verify --print-certs "$f" 2>&1 \
              | grep -i "SHA-256" | head -1 | tee -a ci_out/apk_signer.txt || true
            "$BT/aapt2" dump permissions "$f" 2>&1 | tee -a ci_out/apk_permissions.txt || true
            "$BT/aapt2" dump badging "$f" 2>&1 \
              | grep -E "^package:|native-code|application-debuggable" | tee -a ci_out/apk_permissions.txt || true
          done
          # The release build must not be able to reach the network at all.
          PERMS="$("$BT/aapt2" dump permissions "dist/Valebound-${VERSION}.apk")"
          case "$PERMS" in
            *android.permission.INTERNET*)
              echo "The release build declares INTERNET." | tee -a ci_out/apk_permissions.txt
              exit 1
              ;;
          esac

      - name: Upload APK artifact
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: valebound-apks
          path: dist/*.apk
          retention-days: 30

      - name: Update the latest release
        id: release
        if: steps.apk.outcome == 'success' && (contains(github.event.head_commit.message, '[apk]') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          set -o pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          # The old debug-only download, from before 0.5.0.
          gh release delete latest-debug --cleanup-tag --yes 2>/dev/null || true
          sleep 3
          gh release create latest "dist/Valebound-${VERSION}.apk" "dist/Valebound-${VERSION}-debug.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Valebound ${VERSION}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Install Valebound-${VERSION}.apk: the release build, for arm64 phones. Valebound-${VERSION}-debug.apk is the same app as a debug build, kept as a fallback. Both are signed with the project's fixed personal key, so either installs over the other, or over any earlier build, and keeps its data. Sideload on Android; not for the Play Store." \
            2>&1 | tee ci_out/release.txt

      - name: Publish final results
        if: always()
        env:
          S_PUB: ${{ steps.pub_get.outcome }}
          S_CODEGEN: ${{ steps.codegen.outcome }}
          S_ANALYZE: ${{ steps.analyze.outcome }}
          S_TEST: ${{ steps.test.outcome }}
          S_APK: ${{ steps.apk.outcome }}
        run: bash tool/ci_publish.sh final

      - name: Fail the run if anything did not pass
        if: steps.pub_get.outcome != 'success' || steps.codegen.outcome != 'success' || steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.apk.outcome == 'failure'
        run: exit 1

  # Installs the APK on an Android emulator, launches and relaunches it, and
  # captures the screen at phone and Fold-like sizes. Results go to the
  # `ci-device-results` branch.
  #
  # Everything is built before the emulator starts and the Gradle daemon is
  # stopped: on the 2-core hosted runner, a build running beside the
  # emulator starves it of memory and the emulator dies.
  device-check:
    # Run by hand from the Actions tab ("Run workflow"), not on every push:
    # the hosted emulator has proved unreliable here, and each run spends
    # about fifteen of the account's included Actions minutes.
    if: github.event_name == 'workflow_dispatch'
    # Pinned: the emulator needs KVM, which is known to work on this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESULTS_BRANCH: ci-device-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      # The emulator refuses to start without several GB free for its data
      # image; the hosted runner is nearly full once Flutter is installed.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Build the APKs (before the emulator starts)
        id: prebuild
        run: |
          set -eo pipefail
          mkdir -p ci_out device_shots apk
          flutter pub get 2>&1 | tail -2
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tail -2
          flutter build apk --debug 2>&1 | tail -3
          cp build/app/outputs/flutter-apk/app-debug.apk apk/app-debug.apk
          # The same app with the on-device test as its entry point.
          flutter build apk --debug --target integration_test/app_test.dart 2>&1 | tail -3
          cp build/app/outputs/flutter-apk/app-debug.apk apk/app-debug-test.apk
          (cd android && ./gradlew --stop >/dev/null 2>&1) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin-daemon || true
          free -m | head -2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          disk-size: 4096M
          script: bash tool/device_check.sh

      - name: Publish device results
        if: always()
        env:
          S_DEVICE: ${{ steps.device.outcome }}
        run: bash tool/ci_publish.sh device

      - name: Fail the run if the device check did not pass
        if: steps.device.outcome != 'success'
        run: exit 1
