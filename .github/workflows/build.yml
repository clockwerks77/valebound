name: build

# Builds and tests the app on every push, then publishes:
#   * logs and rendered screenshots to the `ci-results` branch
#   * the debug APK as a workflow artifact and on the `latest-debug` release
#
# Nothing here ships inside the app. The app itself makes no network calls.

on:
  push:
    branches-ignore:
      - ci-results
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Prepare
        run: |
          mkdir -p ci_out
          flutter --version 2>&1 | tee ci_out/flutter_version.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev >/dev/null

      # One-time: generate the Android scaffold with the pinned Flutter
      # version and commit it back, so it is never hand-written.
      - name: Bootstrap Android scaffold
        id: bootstrap
        run: |
          set -eo pipefail
          if [ ! -d android/app ]; then
            flutter create --platforms=android --org app --project-name habit_adventure --no-pub . 2>&1 | tee ci_out/bootstrap.txt
            rm -f test/widget_test.dart
            sed -i 's/android:label="habit_adventure"/android:label="Valebound"/' android/app/src/main/AndroidManifest.xml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android .metadata
            git commit -m "Add generated Android scaffold (flutter create)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Android scaffold already present." | tee ci_out/bootstrap.txt
          fi

      - name: Dependencies
        id: pub_get
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci_out/pub_get.txt

      - name: Code generation (Drift)
        id: codegen
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci_out/codegen.txt

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci_out/analyze.txt

      - name: Test (also renders screenshots)
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --update-goldens --reporter expanded 2>&1 | tee ci_out/test.txt

      - name: Publish test results
        if: always()
        env:
          S_PUB: ${{ steps.pub_get.outcome }}
          S_CODEGEN: ${{ steps.codegen.outcome }}
          S_ANALYZE: ${{ steps.analyze.outcome }}
          S_TEST: ${{ steps.test.outcome }}
          S_APK: pending
        run: bash tool/ci_publish.sh tests

      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ci_out/build_apk.txt
          ls -la build/app/outputs/flutter-apk/ 2>&1 | tee -a ci_out/build_apk.txt

      - name: Upload APK artifact
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Update latest-debug release
        id: release
        if: steps.apk.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          gh release delete latest-debug --cleanup-tag --yes 2>/dev/null || true
          sleep 3
          gh release create latest-debug build/app/outputs/flutter-apk/app-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Sideload on Android; not for the Play Store." \
            2>&1 | tee ci_out/release.txt

      - name: Publish final results
        if: always()
        env:
          S_PUB: ${{ steps.pub_get.outcome }}
          S_CODEGEN: ${{ steps.codegen.outcome }}
          S_ANALYZE: ${{ steps.analyze.outcome }}
          S_TEST: ${{ steps.test.outcome }}
          S_APK: ${{ steps.apk.outcome }}
        run: bash tool/ci_publish.sh final

      - name: Fail the run if anything did not pass
        if: steps.pub_get.outcome != 'success' || steps.codegen.outcome != 'success' || steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.apk.outcome != 'success'
        run: exit 1
